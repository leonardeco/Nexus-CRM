        emails:
          type: array
          items: { type: string }
        phones:
          type: array
          items: { type: string }
        social:
          type: object
          additionalProperties: { type: string }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array

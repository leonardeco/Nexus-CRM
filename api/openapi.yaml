      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required, mfa_enrollment_required]
        mfaChallengeId: { type: string }
        principal:
          $ref: "#/components/schemas/SessionPrincipal"
    SessionPrincipal:
      type: object
      required: [userId, tenantId, role, mfaStatus, scope, email, fullName, tenantSlug]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        mfaStatus:
          type: string
          enum: [not_required, pending, enrolled]
        scope:
          type: string
          enum: [full, mfa_enroll_only]
        email: { type: string, format: email }
        fullName: { type: string }
        tenantSlug: { type: string }
    Tenant:
      type: object
      required: [id, slug, companyName, plan, seatCap, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        companyName: { type: string }
        plan: { type: string, enum: [starter] }
        seatCap: { type: integer }
        status:
          type: string
          enum: [pending_verification, provisioning, active, suspended]
    User:
      type: object
      required: [id, email, fullName, role, status, mfaStatus]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [active, deactivated, pending_invite]
        mfaStatus:
          type: string
          enum: [not_required, pending, enrolled]
    ArcoRequestType:
      type: string
      enum: [acceso, rectificacion, cancelacion, oposicion]
    ArcoRequest:
      type: object
      required: [id, requestType, source, status, requesterName, requesterEmail]
      properties:
        id: { type: string, format: uuid }
        requestType: { $ref: "#/components/schemas/ArcoRequestType" }
        source:
          type: string
          enum: [public_form, logged_in_self, manual_mail]
        status:
          type: string
          enum: [open, responded, closed]
        requesterName: { type: string }
        requesterEmail: { type: string, format: email }
        details: { type: string }
        responseText: { type: string }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor: { type: string }
    AuditEvent:
      type: object
      required: [id, occurredAt, eventType]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorEmail: { type: string }
        eventType:
          type: string
          enum:
            - tenant.signup
            - auth.login.success
            - auth.login.failure
            - users.invite.created
            - users.invite.accepted
            - users.role.changed
            - users.deactivated
            - consent.recorded
            - arco.created
            - arco.responded
            - arco.closed
            - auth.mfa.enrolled
            - auth.email.verified
            - auth.password.reset
            - account.created
            - account.updated
            - account.archived
            - contact.created
            - contact.updated
            - contact.archived
            - contact.consent.recorded
            - contact.assigned
        ipAddress: { type: string }
    ConsentStatus:
      type: string
      enum: [unknown, granted, denied]
    ConsentBasis:
      type: string
      enum: [consentimiento, contrato, interes_legitimo, obligacion_legal]
    Account:
      type: object

      type: object
      properties:
        fullName: { type: string }
    PatchTenantRequest:
      type: object
      properties:
        companyName: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]{3,63}$" }
        policyVersion: { type: string }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

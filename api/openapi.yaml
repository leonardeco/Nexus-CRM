        region: { type: string, nullable: true }
        website: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        ownerUserId: { type: string, format: uuid, nullable: true }
    AccountPatch:
      type: object

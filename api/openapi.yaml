      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    CompleteMfaRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
